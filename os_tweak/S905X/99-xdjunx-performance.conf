# XDJ-UNX Kernel & Memory Performance Optimizations for Armbian / Linux DRM
# Path: /etc/sysctl.d/99-xdjunx-performance.conf

# 1. RAM & Virtual Memory Tuning (Minimize disk I/O latency for audio/UI)
vm.swappiness=10
vm.dirty_background_ratio=5
vm.dirty_ratio=10
vm.vfs_cache_pressure=50

# 2. Real-Time Scheduler Tuning (Prevent RT audio thread preemption)
kernel.sched_rt_runtime_us=950000

# 3. Kernel Printk Log Level (Quiet kernel console to accelerate boot)
kernel.printk=3 4 1 3

# 4. Network & Process Max Limits
net.core.somaxconn=1024
fs.file-max=65536
